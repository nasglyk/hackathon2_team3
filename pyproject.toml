[project]
name = "hachathon2-team3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nassos Glykos", email = "nassosgl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.16",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.15.4",
    "langgraph>=1.2.12",
    "lark>=1.3.1",
    "psycopg[binary]>=3.3.6",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
hachathon2-team3 = "hachathon2_team3:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
